<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>HajjFlow.Unity</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #f5f5f5;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
                /* Prevent double-tap zoom */
                touch-action: manipulation;
                /* Prevent text selection zoom */
                -webkit-user-select: none;
                user-select: none;
                /* Prevent all zoom gestures */
                -webkit-touch-callout: none;
            }
            #unity-canvas {
                width: 100%;
                height: 100%;
                display: block;
                /* Disable double-tap to zoom */
                touch-action: manipulation;
            }
            /* Hide any HTML input elements that Unity creates for TMP_InputField */
            /* This ensures the input happens inside Unity's canvas, not in browser */
            input[type="standard"],
            input[type="text"],
            input[type="password"],
            input[type="email"],
            input[type="number"],
            textarea {
                position: fixed;
                top: -9999px;
                left: -9999px;
                opacity: 0;
                width: 0;
                height: 0;
                border: none;
                padding: 0;
                margin: 0;
                pointer-events: none;
            }
            #loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
                color: #333;
                z-index: 10;
                padding: clamp(20px, 5vw, 50px);
                overflow-y: auto;
            }
            #loader-title {
                font-size: clamp(36px, 10vw, 72px);
                font-weight: 700;
                margin-bottom: clamp(30px, 5vw, 50px);
                text-align: center;
                letter-spacing: 2px;
                color: #333;
            }
            #loader-text {
                font-size: clamp(15px, 4vw, 20px);
                line-height: 1.8;
                max-width: 85vw;
                max-width: 1000px;
                text-align: center;
                margin-bottom: clamp(40px, 6vw, 60px);
                color: #c41e3a;
                font-weight: 600;
                padding: clamp(25px, 5vw, 40px);
                border-left: 5px solid #c41e3a;
                border-radius: 8px;
                background: rgba(196, 30, 58, 0.08);
                box-shadow: 0 4px 15px rgba(196, 30, 58, 0.12);
                letter-spacing: 0.3px;
            }
            #loader-progress-container {
                width: 85vw;
                max-width: 500px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(15px, 3vw, 25px);
            }
            #loader-progress-text {
                font-size: clamp(18px, 3.5vw, 28px);
                font-weight: 300;
                color: #333;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .spinner {
                display: inline-block;
                width: clamp(20px, 4vw, 32px);
                height: clamp(20px, 4vw, 32px);
                border: 3px solid rgba(196, 30, 58, 0.2);
                border-top-color: #c41e3a;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            .logo-container {
                width: clamp(20px, 10vw, 30px);
                height: auto;
                margin-bottom: clamp(20px, 4vw, 30px);
                align-items: center;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #loader-progress-bar {
                width: 100%;
                height: clamp(8px, 2vw, 16px);
                background: rgba(0, 0, 0, 0.1);
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            #loader-progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #c41e3a 0%, #e63f5a 100%);
                width: 0%;
                transition: width 0.3s ease;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(196, 30, 58, 0.5);
            }
            #loader-progress-percent {
                font-size: clamp(14px, 2.5vw, 20px);
                color: #666;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
    <div id="loader">
        <div id="logo-container">
            <img src="Logo.png" alt="Kavkaz Travel Logo" class="logo">
        </div>   
        <div id="loader-text">HajjFlow это ваш помощник в подготовке к Умре. Во время поездки всегда следуйте указаниям руководителя вашей группы. Если у вас возник вопрос или нестандартная ситуация, обратитесь к руководителю, не принимайте самостоятельных решений на основании приложения.</div>
        <div id="loader-progress-container">
            <div id="loader-progress-text">
                <span class="spinner"></span>
                <span>Загрузка...</span>
            </div>
            <div id="loader-progress-bar">
                <div id="loader-progress-fill"></div>
            </div>
            <div id="loader-progress-percent">0%</div>
        </div>
    </div>
    <canvas id="unity-canvas"></canvas>
    
    <script src="Build/Build1.loader.js"></script>
    <script>
        // === WebGL Input Handling Configuration ===
        // This ensures TMP_InputField works correctly without displaying
        // custom keyboard overlays or input interfaces.

        // Prevent zoom: Ctrl+Scroll wheel
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });

        // Prevent pinch zoom (two-finger gesture)
        document.addEventListener('touchmove', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        // Allow Unity to handle all input field interactions natively
        // This prevents browser from hijacking input focus with custom keyboards
        let unityInstance = null;

        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressFill = document.querySelector("#loader-progress-fill");
        const progressPercent = document.querySelector("#loader-progress-percent");
        
        const config = {
            dataUrl: "Build/Build1.data",
            frameworkUrl: "Build/Build1.framework.js",
            codeUrl: "Build/Build1.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "HajjFlow.Unity",
            productVersion: "0.1.0"
        };
        
        createUnityInstance(canvas, config, (progressValue) => {
            const percent = Math.round(progressValue * 100);
            progressFill.style.width = percent + "%";
            progressPercent.textContent = percent + "%";
        }).then((instance) => {
            unityInstance = instance;
            loader.style.display = "none";
            
            // Configure WebGL canvas for proper input handling
            // This tells the browser to let Unity handle all input events
            if (canvas.style) {
                canvas.style.touchAction = "manipulation";
            }
        }).catch((message) => {
            const progressText = document.querySelector("#loader-progress-text span:last-child");
            progressText.textContent = "Ошибка загрузки: " + message;
            progressPercent.textContent = "0%";
        });
    </script>
    </body>
    </html>
