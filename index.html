<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>HajjFlow — Помощник в подготовке к Умре</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #CCCCCC;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        z-index: 10;
        padding: clamp(20px, 5vw, 40px);
        overflow-y: auto;
      }

      #loader-title {
        font-size: clamp(32px, 8vw, 56px);
        font-weight: 700;
        margin-bottom: clamp(20px, 3vw, 40px);
        text-align: center;
        letter-spacing: 2px;
        color: #333;
      }

      #loader-text {
        font-size: clamp(18px, 3.5vw, 28px);
        line-height: 1.8;
        max-width: 90vw;
        text-align: center;
        margin-bottom: clamp(30px, 5vw, 50px);
        color: #c41e3a;
        font-weight: 600;
        padding: clamp(20px, 4vw, 35px);
        border-left: 5px solid #c41e3a;
        border-radius: 8px;
        background: rgba(196, 30, 58, 0.08);
        box-shadow: 0 4px 15px rgba(196, 30, 58, 0.12);
        letter-spacing: 0.3px;
      }

      #loader-progress {
        font-size: clamp(14px, 2vw, 20px);
        color: #555;
        margin-top: clamp(20px, 3vw, 30px);
      }

      .spinner {
        display: inline-block;
        margin-right: 10px;
        color: #c41e3a;
      }

      @media (max-width: 768px) {
        #loader {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div id="loader-title">HajjFlow</div>
      <div id="loader-text">ваш помощник в подготовке к Умре. Во время поездки всегда следуйте указаниям руководителя вашей группы. Если у вас возник вопрос или нестандартная ситуация, обратитесь к руководителю, не принимайте самостоятельных решений на основании приложения.</div>
      <div id="loader-progress"><span class="spinner">⟳</span>Загрузка... 0%</div>
    </div>

    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
    
    <script src="Build/Build1.loader.js"></script>
    <script>
      const loader = document.getElementById('loader');
      const progressText = document.getElementById('loader-progress');
      let spinnerAngle = 0;

      function updateSpinner() {
        spinnerAngle = (spinnerAngle + 6) % 360;
        const spinner = document.querySelector('.spinner');
        if (spinner) {
          spinner.style.display = 'inline-block';
          spinner.style.transform = `rotate(${spinnerAngle}deg)`;
        }
      }

      setInterval(updateSpinner, 30);

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Build1.data",
        frameworkUrl: "Build/Build1.framework.js",
        codeUrl: "Build/Build1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HajjFlow.Unity",
        productVersion: "0.1.0",
      }, (progress) => {
        progressText.innerHTML = `<span class="spinner">⟳</span>Загрузка... ${Math.round(progress * 100)}%`;
      }).then((unityInstance) => {
        loader.style.display = "none";
      }).catch((message) => {
        progressText.innerHTML = `Ошибка загрузки: ${message}`;
      });
    </script>
  </body>
</html>
