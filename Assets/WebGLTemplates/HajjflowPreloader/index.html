<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>{{{ PRODUCT_NAME }}}</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #f5f5f5;
                overflow: hidden;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            }
            #unity-canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
                color: #333;
                z-index: 10;
                padding: clamp(20px, 5vw, 50px);
                overflow-y: auto;
            }
            #loader-title {
                font-size: clamp(36px, 10vw, 72px);
                font-weight: 700;
                margin-bottom: clamp(30px, 5vw, 50px);
                text-align: center;
                letter-spacing: 2px;
                color: #333;
            }
            #loader-text {
                font-size: clamp(20px, 4vw, 32px);
                line-height: 1.8;
                max-width: 85vw;
                max-width: 1000px;
                text-align: center;
                margin-bottom: clamp(40px, 6vw, 60px);
                color: #c41e3a;
                font-weight: 600;
                padding: clamp(25px, 5vw, 40px);
                border-left: 5px solid #c41e3a;
                border-radius: 8px;
                background: rgba(196, 30, 58, 0.08);
                box-shadow: 0 4px 15px rgba(196, 30, 58, 0.12);
                letter-spacing: 0.3px;
            }
            #loader-progress-container {
                width: 85vw;
                max-width: 500px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(15px, 3vw, 25px);
            }
            #loader-progress-text {
                font-size: clamp(18px, 3.5vw, 28px);
                font-weight: 600;
                color: #333;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .spinner {
                display: inline-block;
                width: clamp(20px, 4vw, 32px);
                height: clamp(20px, 4vw, 32px);
                border: 3px solid rgba(196, 30, 58, 0.2);
                border-top-color: #c41e3a;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
            #loader-progress-bar {
                width: 100%;
                height: clamp(8px, 2vw, 16px);
                background: rgba(0, 0, 0, 0.1);
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            #loader-progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #c41e3a 0%, #e63f5a 100%);
                width: 0%;
                transition: width 0.3s ease;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(196, 30, 58, 0.5);
            }
            #loader-progress-percent {
                font-size: clamp(14px, 2.5vw, 20px);
                color: #666;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
    <div id="loader">
        <div id="loader-title">HajjFlow</div>
        <div id="loader-text">ваш помощник в подготовке к Умре. Во время поездки всегда следуйте указаниям руководителя вашей группы. Если у вас возник вопрос или нестандартная ситуация, обратитесь к руководителю, не принимайте самостоятельных решений на основании приложения.</div>
        <div id="loader-progress-container">
            <div id="loader-progress-text">
                <span class="spinner"></span>
                <span>Загрузка...</span>
            </div>
            <div id="loader-progress-bar">
                <div id="loader-progress-fill"></div>
            </div>
            <div id="loader-progress-percent">0%</div>
        </div>
    </div>
    <canvas id="unity-canvas"></canvas>
    
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progressFill = document.querySelector("#loader-progress-fill");
        const progressPercent = document.querySelector("#loader-progress-percent");
        
        const config = {
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };
        
        createUnityInstance(canvas, config, (progressValue) => {
            const percent = Math.round(progressValue * 100);
            progressFill.style.width = percent + "%";
            progressPercent.textContent = percent + "%";
        }).then(() => {
            loader.style.display = "none";
        }).catch((message) => {
            const progressText = document.querySelector("#loader-progress-text span:last-child");
            progressText.textContent = "Ошибка загрузки: " + message;
            progressPercent.textContent = "0%";
        });
    </script>
    </body>
    </html>
