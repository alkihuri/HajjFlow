<!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>{{{ PRODUCT_NAME }}}</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: #f5f5f5;
                overflow: hidden;
            }
            #unity-canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
                color: #333;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                z-index: 10;
                padding: 20px;
            }
            #loader-title {
                font-size: 24px;
                font-weight: 600;
                margin-bottom: 20px;
                text-align: center;
            }
            #loader-text {
                font-size: 14px;
                line-height: 1.6;
                max-width: 500px;
                text-align: center;
                margin-bottom: 30px;
                color: #666;
            }
            #loader-progress {
                font-size: 16px;
                color: #333;
            }
        </style>
    </head>
    <body>
    <div id="loader">
        <div id="loader-title">HajjFlow</div>
        <div id="loader-text">ваш помощник в подготовке к Умре. Во время поездки всегда следуйте указаниям руководителя вашей группы. Если у вас возник вопрос или нестандартная ситуация, обратитесь к руководителю, не принимайте самостоятельных решений на основании приложения.</div>
        <div id="loader-progress">Загрузка... 0%</div>
    </div>
    <canvas id="unity-canvas"></canvas>
    
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
        const canvas = document.querySelector("#unity-canvas");
        const loader = document.querySelector("#loader");
        const progress = document.querySelector("#loader-progress");
    
        const config = {
            dataUrl: "Build/{{{ DATA_FILENAME }}}",
            frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: "Build/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };
    
        createUnityInstance(canvas, config, (progressValue) => {
            progress.textContent = "Загрузка... " + Math.round(progressValue * 100) + "%";
        }).then(() => {
            loader.style.display = "none";
        }).catch((message) => {
            progress.textContent = "Ошибка загрузки: " + message;
        });
    </script>
    </body>
    </html>
